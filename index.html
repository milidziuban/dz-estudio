<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-rosa.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-blanco.svg"
      media="(prefers-color-scheme: dark)"
    />
    <title>DZ Estudio — Maximalismo con criterio</title>

    <!--
      Tarjeta al compartir el link (Open Graph).

      Estas etiquetas tienen que estar ACÁ, en el HTML que el servidor manda de
      entrada. Los robots de WhatsApp, Instagram y Facebook no ejecutan
      JavaScript: entran, leen el código crudo y se van. Si las etiquetas las
      pone react-helmet después de cargar la página, el robot ya se fue y el
      link se comparte pelado.

      react-helmet-async las reemplaza igual en el navegador con las de cada
      página (por eso el data-rh), así que src/components/Seo.tsx sigue mandando
      para el usuario. Esto es el piso, para el robot.

      Al cambiar cualquiera de estos textos, cambiarlo también en
      src/lib/site.ts.
    -->
    <meta
      name="description"
      data-rh="true"
      content="Almohadones e individuales estampados, diseñados y hechos en Argentina."
    />
    <link rel="canonical" data-rh="true" href="https://www.dz-estudio.com/" />

    <meta property="og:type" data-rh="true" content="website" />
    <meta property="og:site_name" data-rh="true" content="DZ Estudio" />
    <meta property="og:locale" data-rh="true" content="es_AR" />
    <meta
      property="og:title"
      data-rh="true"
      content="DZ Estudio — Maximalismo con criterio"
    />
    <meta
      property="og:description"
      data-rh="true"
      content="Almohadones e individuales estampados, diseñados y hechos en Argentina."
    />
    <meta property="og:url" data-rh="true" content="https://www.dz-estudio.com/" />
    <meta
      property="og:image"
      data-rh="true"
      content="https://www.dz-estudio.com/og-cover.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Almohadones estampados de DZ Estudio"
    />

    <meta name="twitter:card" data-rh="true" content="summary_large_image" />
    <meta
      name="twitter:title"
      data-rh="true"
      content="DZ Estudio — Maximalismo con criterio"
    />
    <meta
      name="twitter:description"
      data-rh="true"
      content="Almohadones e individuales estampados, diseñados y hechos en Argentina."
    />
    <meta
      name="twitter:image"
      data-rh="true"
      content="https://www.dz-estudio.com/og-cover.png"
    />
    <!--
      Quién es la marca, para Google (schema.org).

      Va acá y no en React porque no cambia nunca y vale para todo el sitio.
      Lo que sí cambia página por página —el producto, su precio y su stock—
      lo pone src/components/Seo.tsx desde src/lib/structured-data.ts.

      Al cambiar el mail o el Instagram, cambiarlo también en src/lib/site.ts.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "OnlineStore",
        "name": "DZ Estudio",
        "url": "https://www.dz-estudio.com/",
        "logo": "https://www.dz-estudio.com/logo-extendido.svg",
        "image": "https://www.dz-estudio.com/og-cover.png",
        "description": "Almohadones e individuales estampados, diseñados y hechos en Argentina.",
        "email": "milagrosdziuban@hotmail.com",
        "currenciesAccepted": "ARS",
        "areaServed": { "@type": "Country", "name": "Argentina" },
        "sameAs": ["https://instagram.com/dzestudio_"]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
